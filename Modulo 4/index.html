<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Proyecto Módulo 4</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="container mt-5">
      <div class="text-center">
        <h1 class="titulo">Proyecto Módulo 4</h1>

        <p class="descripcion">
          Formulario de registro utilizando Bootstrap, jQuery, JavaScript y
          Sass.
        </p>

        <button
          id="modalBtn"
          type="button"
          class="btn btn-principal"
          data-bs-toggle="modal"
          data-bs-target="#miModal"
        >
          Abrir Modal
        </button>
      </div>

      <div
        class="modal fade"
        id="miModal"
        tabindex="-1"
        aria-labelledby="modalTitulo"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <!-- ENCABEZADO -->
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Registro</h5>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>

            <div class="modal-body">
              <form id="registroForm">
                <!-- EMAIL -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Ingrese su email"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="nombre" class="form-label"> Nombre </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Ingrese su nombre"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="mensaje" class="form-label"> Mensaje </label>

                  <textarea
                    class="form-control"
                    id="mensaje"
                    rows="4"
                    placeholder="Escriba su mensaje"
                    required
                  ></textarea>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-enviar">Enviar</button>
                </div>
              </form>
            </div>

            <!-- PIE DEL MODAL -->
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-cerrar"
                data-bs-dismiss="modal"
              >
                Cerrar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/scripts.js"></script>
  </body>
</html>
